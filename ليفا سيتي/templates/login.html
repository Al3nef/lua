<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول · ليفا سيتي</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="brand">
                <span class="brand-icon">🏛️</span>
                <h1>LIVA CITY</h1>
                <p class="subtitle">ليفا سيتي · إدارة العقارات والمقرات</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }}">{{ msg }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" autocomplete="off">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" placeholder="ادخل اسم المستخدم" required autofocus>

                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="ادخل كلمة المرور" required>

                <button type="submit">دخول للنظام ✦</button>
            </form>
        </div>
    </div>
</body>
</html>
